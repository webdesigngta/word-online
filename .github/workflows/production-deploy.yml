name: Word Online Production Deploy

# Production pipeline: GitHub → Build → HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to HostGator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build production app
        run: npm run build

      - name: Deploy build to HostGator FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_SERVER }}
          username: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTGATOR_PATH }}
