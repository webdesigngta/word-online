name: Deploy Doc321 Production

# Single production deployment pipeline for Doc321.com.
# GitHub main is the source of truth; production is deployed to the
# dedicated HostGator FTP account rooted at /home2/ddhynzte/doc321.com.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc321-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://doc321.com
      NEXT_PUBLIC_ALLOW_INDEXING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      FTP_SERVER: ftp.ddh.ynz.temporary.site
      FTP_USERNAME: doc321@doc321.com
      FTP_PASSWORD: ${{ secrets.DOC321_FTP_PASSWORD }}
      FTP_PATH: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Doc321 production export
        run: npm run build

      - name: Verify export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          test -f out/robots.txt
          grep -q 'Allow: /' out/robots.txt

          # Guard the shared task-page system on normal tools.
          for route in \
            docx-viewer \
            merge-word-documents \
            docx-to-html \
            docx-to-txt \
            docx-to-rtf \
            word-count \
            compare-word-documents \
            split-word-document \
            extract-docx-images; do
            page="out/${route}/index.html"
            echo "Verifying DOC321 shared tool shell: ${page}"
            test -f "$page"
            grep -q 'platform-task-page' "$page"
          done

          # Native editors must remain native and must NOT be forced into the
          # generic upload-card experience.
          for route in word-online docx-editor create-word-document; do
            page="out/${route}/index.html"
            echo "Verifying native Word editor: ${page}"
            test -f "$page"
            grep -q 'editor-route' "$page"
          done

          page="out/online-notepad/index.html"
          echo "Verifying native Online Notepad: ${page}"
          test -f "$page"
          grep -q 'notepad-native-page' "$page"
          grep -q 'notepad-is-shell' "$page"

          printf '%s\n' "${GITHUB_SHA::12}" > out/build.txt

      - name: Validate Doc321 FTP password
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FTP_PASSWORD" ]; then
            echo "Missing DOC321_FTP_PASSWORD GitHub Actions secret."
            exit 1
          fi

      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Verify Doc321 FTP login
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          pwd
          cls -la "$FTP_PATH"
          bye
          EOF

      - name: Deploy Doc321 production to HostGator
        shell: bash
        run: |
          set -euo pipefail

          # Deploy immutable Next.js assets first and KEEP older hashed chunks.
          # This prevents an already-open/cached page from failing while a new
          # release is being uploaded. New HTML is published only after every
          # chunk it references is already available.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set xfer:clobber true
          mirror --reverse --verbose --parallel=4 ./out/_next/ "$FTP_PATH/_next/"
          bye
          EOF

          # Publish HTML and other public files second. Delete stale non-_next
          # files, but deliberately preserve old hashed _next assets so cached
          # tabs can finish loading safely after a deployment.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set xfer:clobber true
          mirror --reverse --verbose --delete --parallel=2 --exclude-glob '_next/**' ./out/ "$FTP_PATH"
          bye
          EOF

      - name: Verify uploaded build marker
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/doc321-build.txt

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          get "./build.txt" -o /tmp/doc321-build.txt
          bye
          EOF

          expected="${GITHUB_SHA::12}"
          deployed="$(tr -d '\r\n' < /tmp/doc321-build.txt)"
          test "$deployed" = "$expected"
          echo "Verified Doc321 production deployment: $deployed"

      - name: Public DNS and HTTPS smoke test
        shell: bash
        run: |
          set -euo pipefail
          getent ahostsv4 doc321.com

          for path in \
            / \
            /tools/ \
            /pdf-to-word/ \
            /word-to-pdf/ \
            /compress-pdf/ \
            /docx-viewer/ \
            /merge-word-documents/ \
            /docx-to-html/ \
            /docx-to-txt/ \
            /docx-to-rtf/ \
            /word-online/ \
            /docx-editor/ \
            /create-word-document/ \
            /online-notepad/ \
            /robots.txt; do
            url="https://doc321.com${path}"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output /dev/null \
              --write-out 'HTTP %{http_code} | final=%{url_effective}\n' \
              "$url"
          done

          curl --fail --silent --show-error https://doc321.com/robots.txt | grep -q 'Allow: /'

          # Verify that the live native editor pages contain their expected
          # shells rather than only returning an HTTP 200 fallback page.
          curl --fail --silent --show-error https://doc321.com/word-online/ | grep -q 'editor-route'
          curl --fail --silent --show-error https://doc321.com/docx-editor/ | grep -q 'editor-route'
          curl --fail --silent --show-error https://doc321.com/create-word-document/ | grep -q 'editor-route'
          curl --fail --silent --show-error https://doc321.com/online-notepad/ | grep -q 'notepad-native-page'

          # Catch the most common "page couldn't load" failure: HTML deployed
          # successfully but a referenced Next.js JavaScript chunk is missing.
          editor_html="$(curl --fail --silent --show-error https://doc321.com/word-online/)"
          editor_chunk="$(printf '%s' "$editor_html" | grep -oE '/_next/static/[^\" ]+\.js' | head -n 1)"
          test -n "$editor_chunk"
          echo "Checking editor JS chunk: $editor_chunk"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --output /dev/null \
            "https://doc321.com${editor_chunk}"
