name: Deploy Doc321 Preview

# Safe migration workflow for Doc321.com.
# Manual-only until the new HostGator document root, DNS, and SSL are verified.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc321-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://doc321.com
      NEXT_PUBLIC_ALLOW_INDEXING: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      FTP_SERVER: ${{ secrets.DOC321_FTP_SERVER || secrets.HOSTGATOR_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.DOC321_FTP_USERNAME || secrets.HOSTGATOR_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.DOC321_FTP_PASSWORD || secrets.HOSTGATOR_FTP_PASSWORD }}
      # Existing HostGator FTP account is rooted at public_html.
      # cPanel document root for doc321.com:
      # /home2/ddhynzte/public_html/website_4e5f58cf
      FTP_PATH: ${{ secrets.DOC321_FTP_PATH || './website_4e5f58cf/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Doc321 root export
        run: npm run build

      - name: Verify export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          printf '%s\n' "${GITHUB_SHA::12}" > out/build.txt

      - name: Validate Doc321 deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing FTP credentials. Add DOC321_FTP_* secrets or keep the existing HOSTGATOR_FTP_* secrets."
            exit 1
          fi
          if [ -z "$FTP_PATH" ]; then
            echo "Missing Doc321 FTP path."
            exit 1
          fi

      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy Doc321 preview to HostGator
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set xfer:clobber true
          mirror --reverse --verbose --delete --parallel=2 ./out/ "$FTP_PATH"
          bye
          EOF

      - name: Verify uploaded build marker
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PATH="${FTP_PATH%/}/build.txt"
          rm -f /tmp/doc321-build.txt

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          get "$REMOTE_PATH" -o /tmp/doc321-build.txt
          bye
          EOF

          expected="${GITHUB_SHA::12}"
          deployed="$(tr -d '\r\n' < /tmp/doc321-build.txt)"
          test "$deployed" = "$expected"
          echo "Verified Doc321 preview deployment: $deployed"
