name: Edit PDF Open Hardening

on:
  pull_request:
    paths:
      - 'components/PdfSmartEditLoader.tsx'
      - 'components/PdfEditorWorkspace.tsx'
      - 'qa/check-edit-pdf-open-hardening.mjs'
      - '.github/workflows/edit-pdf-open-hardening.yml'
  push:
    branches:
      - main
    paths:
      - 'components/PdfSmartEditLoader.tsx'
      - 'components/PdfEditorWorkspace.tsx'
      - 'qa/check-edit-pdf-open-hardening.mjs'
      - '.github/workflows/edit-pdf-open-hardening.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Edit PDF opening regression check
        run: node qa/check-edit-pdf-open-hardening.mjs
