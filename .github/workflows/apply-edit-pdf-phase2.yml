name: Apply Edit PDF Phase 2

on:
  push:
    branches:
      - feat/edit-pdf-ocr-style-accuracy
    paths:
      - 'scripts/apply-edit-pdf-phase2.mjs'
      - '.github/workflows/apply-edit-pdf-phase2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/edit-pdf-ocr-style-accuracy
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply Phase 2 patch
        run: node scripts/apply-edit-pdf-phase2.mjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify PDF editor contract
        run: node qa/check-pdf-editor.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PdfEditorWorkspace.tsx qa/check-pdf-editor.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Improve Edit PDF OCR and style accuracy'
          git push origin HEAD:feat/edit-pdf-ocr-style-accuracy
