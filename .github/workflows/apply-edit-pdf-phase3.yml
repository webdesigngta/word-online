name: Apply Edit PDF Phase 3

on:
  push:
    branches:
      - feat/edit-pdf-phase3-custom-fonts
    paths:
      - 'scripts/apply-edit-pdf-phase3.py'
      - '.github/workflows/apply-edit-pdf-phase3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/edit-pdf-phase3-custom-fonts
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply Phase 3 patch
        run: python3 scripts/apply-edit-pdf-phase3.py

      - name: Add fontkit dependency
        run: npm install @pdf-lib/fontkit@1.1.1 --save --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify PDF editor contract
        run: node qa/check-pdf-editor.mjs

      - name: Production build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PdfEditorWorkspace.tsx qa/check-pdf-editor.mjs package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Add Edit PDF original and custom font embedding'
          git push origin HEAD:feat/edit-pdf-phase3-custom-fonts
