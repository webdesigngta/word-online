name: CI and Deploy Word Online

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: word-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_BASE_PATH: /word-online
      NEXT_TELEMETRY_DISABLED: '1'
      FTP_SERVER: ${{ secrets.HOSTGATOR_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
      FTP_PATH: ${{ secrets.HOSTGATOR_FTP_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify export
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -d out/_next
          printf '%s\n' "${GITHUB_SHA::12}" > out/build.txt

      - name: Install FTP client
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy to HostGator
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.FTP_SERVER != '' && env.FTP_USERNAME != '' && env.FTP_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          FTP_PATH="${FTP_PATH:-./word-online/}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 30
          set xfer:clobber true
          mirror --reverse --verbose --delete --parallel=2 ./out/ "$FTP_PATH"
          bye
          EOF

      - name: Deployment not configured yet
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (env.FTP_SERVER == '' || env.FTP_USERNAME == '' || env.FTP_PASSWORD == '') }}
        run: echo "Build succeeded. Add the HostGator repository secrets to enable automatic deployment."
