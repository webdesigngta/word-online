name: Verify HostGator deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.HOSTGATOR_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.HOSTGATOR_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
      FTP_PATH: ${{ secrets.HOSTGATOR_FTP_PATH }}
    steps:
      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Verify deployed build marker
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?HOSTGATOR_FTP_SERVER is required}"
          : "${FTP_USERNAME:?HOSTGATOR_FTP_USERNAME is required}"
          : "${FTP_PASSWORD:?HOSTGATOR_FTP_PASSWORD is required}"
          FTP_PATH="${FTP_PATH:-./word-online/}"
          EXPECTED="${{ github.event.pull_request.base.sha }}"
          EXPECTED="${EXPECTED:0:12}"

          for attempt in $(seq 1 30); do
            rm -f /tmp/build.txt
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:passive-mode true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30; get ${FTP_PATH%/}/build.txt -o /tmp/build.txt; bye"; then
              if [ -f /tmp/build.txt ]; then
                REMOTE="$(tr -d '\r\n' < /tmp/build.txt)"
                echo "Attempt $attempt — expected: $EXPECTED, remote: $REMOTE"
                if [ "$REMOTE" = "$EXPECTED" ]; then
                  exit 0
                fi
              fi
            fi
            sleep 10
          done

          echo "HostGator did not reach expected build $EXPECTED in time." >&2
          exit 1
