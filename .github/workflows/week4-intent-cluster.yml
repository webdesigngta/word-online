name: Week 4 Intent Cluster Gate

on:
  push:
    branches:
      - main
    paths:
      - 'app/docx-editor/**'
      - 'app/docx-viewer/**'
      - 'app/docx-to-pdf/**'
      - 'app/word-to-pdf/**'
      - 'app/create-word-document/**'
      - 'components/EditorIntentPrompt.tsx'
      - 'components/IntentClusterLinks.tsx'
      - 'components/WordEditorClientLoader.tsx'
      - 'components/WordEditorClientRuntime.tsx'
      - 'components/WordEditorExperience.tsx'
      - 'qa/check-week4-intent-pages.mjs'
      - '.github/workflows/week4-intent-cluster.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/docx-editor/**'
      - 'app/docx-viewer/**'
      - 'app/docx-to-pdf/**'
      - 'app/word-to-pdf/**'
      - 'app/create-word-document/**'
      - 'components/EditorIntentPrompt.tsx'
      - 'components/IntentClusterLinks.tsx'
      - 'components/WordEditorClientLoader.tsx'
      - 'components/WordEditorClientRuntime.tsx'
      - 'components/WordEditorExperience.tsx'
      - 'qa/check-week4-intent-pages.mjs'
      - '.github/workflows/week4-intent-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intent-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /word-online
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify five Week 4 intent pages
        run: node qa/check-week4-intent-pages.mjs
